name: ZAP Baseline Scan (DAST)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    # Start OWASP Juice Shop as the target application
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Juice Shop to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Juice Shop is up"; exit 0
            fi
            echo "Waiting for Juice Shop... ($i)"; sleep 5
          done
          echo "Juice Shop did not start in time"; exit 1

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
          artifact_name: 'zap-report'
